[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
license = "LGPL-2.1-or-later"

[workspace.dependencies]
tet-domain = { path = "crates/tet-domain" }

rand = { version = "0.10.3" }
thiserror = { version = "2.0.21" }

# dev dependencies
rstest = { version = "0.27.0" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
